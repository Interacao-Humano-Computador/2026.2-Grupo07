site_name: IHC - PCI Concursos
site_description: DocumentaÃ§Ã£o do projeto da disciplina de InteraÃ§Ã£o Humano-Computador (FGA-UnB) - AnÃ¡lise e Reprojeto do PCI Concursos
site_author: Equipe Grupo 07 - IHC
site_url: https://Interacao-Humano-Computador.github.io/2026.2-Grupo07/

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  logo: assets/images/pci_logo_white.png
  favicon: assets/images/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  
  # ConfiguraÃ§Ã£o de Cores e Contraste (Modo Claro/Escuro)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/toggle-switch-off-outline
        name: Mudar para o Modo Escuro (Alto Contraste)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Mudar para o Modo Claro

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Extensões obrigatórias para renderizar tabelas e HTML corretamente
markdown_extensions:
  - tables
  - admonition
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

