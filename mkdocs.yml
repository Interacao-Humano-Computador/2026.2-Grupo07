theme:
  name: material
  language: pt-BR
  logo: assets/images/pci_logo_white.png
  favicon: assets/images/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  
  # ConfiguraÃ§Ã£o de Cores e Contraste (Modo Claro/Escuro)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: red
      toggle:
        icon: material/toggle-switch-off-outline
        name: Mudar para o Modo Escuro (Alto Contraste)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: red
      toggle:
        icon: material/toggle-switch
        name: Mudar para o Modo Claro

extra_css:
  - stylesheets/extra.css

# ExtensÃµes obrigatÃ³rias para renderizar tabelas e HTML corretamente
markdown_extensions:
  - tables
  - admonition
  - md_in_html
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

