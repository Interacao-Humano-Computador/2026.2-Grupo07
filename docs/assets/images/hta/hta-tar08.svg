  <text x="706.4" y="206.5" text-anchor="middle" font-size="12" fill="#111827">(Double Opt-In)</text>
  <line x1="1010.6" y1="124.0" x2="1010.6" y2="147.0" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="1006.4,145.5 1014.8,145.5 1010.6,153.5" fill="#4b5563"/>
