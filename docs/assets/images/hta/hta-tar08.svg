  <text x="501.6" y="420.2" text-anchor="middle" font-size="12" fill="#111827">1.2.2. Informar e-mail</text>
  <text x="501.6" y="435.8" text-anchor="middle" font-size="12" fill="#111827">e marcar aceite LGPD</text>
  <line x1="706.4" y1="124.0" x2="706.4" y2="147.0" stroke="#4b5563" stroke-width="1.5"/>
