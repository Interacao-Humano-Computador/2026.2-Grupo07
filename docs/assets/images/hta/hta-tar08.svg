<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1233 481" width="100%" style="max-width: 1233px; height: auto; background: #ffffff; font-family: Arial, Helvetica, sans-serif;">
  <rect x="519.0" y="20.0" width="230.0" height="80.0" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="634.0" y="41.5" text-anchor="middle" font-size="12.5" fill="#111827">0. Cadastrar e</text>
  <text x="634.0" y="57.0" text-anchor="middle" font-size="12.5" fill="#111827">parametrizar alertas</text>
  <text x="634.0" y="72.5" text-anchor="middle" font-size="12.5" fill="#111827">inteligentes de editais</text>
  <text x="634.0" y="89.5" text-anchor="middle" font-size="12.5" fill="#111827">1&gt;2&gt;3</text>
  <line x1="634.0" y1="100.0" x2="634.0" y2="124.0" stroke="#4b5563" stroke-width="1.5"/>
