  <text x="906.8" y="301.8" text-anchor="middle" font-size="12" fill="#111827">3.1. Abrir card de vaga</text>
  <text x="906.8" y="317.2" text-anchor="middle" font-size="12" fill="#111827">do DF ou editar filtros</text>
  <line x1="1114.4" y1="242.5" x2="1114.4" y2="265.5" stroke="#4b5563" stroke-width="1.5"/>
  <polygon points="1110.2,264.0 1118.6,264.0 1114.4,272.0" fill="#4b5563"/>
  <rect x="1019.6" y="272.5" width="189.6" height="64.5" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <line x1="1019.6" y1="342.0" x2="1209.2" y2="342.0" stroke="#374151" stroke-width="1.6"/>
  <text x="1114.4" y="294.0" text-anchor="middle" font-size="12" fill="#111827">3.2. Acionar</text>
  <text x="1114.4" y="309.5" text-anchor="middle" font-size="12" fill="#111827">descadastro imediato em</text>
  <text x="1114.4" y="325.0" text-anchor="middle" font-size="12" fill="#111827">1 clique</text>
